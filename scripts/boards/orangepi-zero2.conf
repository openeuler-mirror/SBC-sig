ubootconfig=
local_uboot_dir=${nonfree_bin_dir}/u-boot/orangepi-zero2
dtb_name=sun50i-h616-orangepi-zero2
platform=allwinner
soc_name=h616
arch=arm64
part_table=msdos

POST_BOARD_OVERLAY() {
    echo "Put ${board} firmware into rootfs..."
    
    # uwe5622 firmware
    mkdir -p ${rootfs_dir}/usr/lib/firmware/uwe5622
    cp ${nonfree_bin_dir}/linux-firmware/uwe5622/wcnmodem-38222.bin ${rootfs_dir}/usr/lib/firmware/uwe5622
    cp ${nonfree_bin_dir}/linux-firmware/uwe5622/wcnmodem.bin ${rootfs_dir}/usr/lib/firmware/uwe5622
    cp ${nonfree_bin_dir}/linux-firmware/uwe5622/wifi_2355b001_1ant.ini ${rootfs_dir}/usr/lib/firmware/uwe5622

    pushd ${rootfs_dir}/usr/lib/firmware
    ln -s uwe5622/wcnmodem.bin wcnmodem.bin
    ln -s uwe5622/wifi_2355b001_1ant.ini wifi_2355b001_1ant.ini
    popd
}
